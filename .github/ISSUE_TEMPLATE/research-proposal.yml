name: Research or scope proposal
description: Suggest an evidence-backed direction for SCUM-SENF; no production claims.
title: "research: "
body:
  - type: markdown
    attributes:
      value: |
        SCUM-SENF is in its foundation/research phase. Please keep proposals scoped,
        testable and aligned with [AGENTS.md](../../AGENTS.md).
        Never post player data, credentials, private server logs or sensitive vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the server-operator need rather than a preselected framework.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and sources
      description: Links, observed behavior, version, or reproducible measurements.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed minimal scope and constraints
      description: Explicit non-goals and how success could be verified.
    validations:
      required: false
